services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: upimesh
      POSTGRES_USER: upimesh
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U upimesh -d upimesh"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DATABASE_URL: jdbc:postgresql://db:5432/upimesh
      DATABASE_USER: upimesh
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      KEY_DIRECTORY: /app/data/keys
    volumes:
      - key-data:/app/data
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres-data:
  key-data:
